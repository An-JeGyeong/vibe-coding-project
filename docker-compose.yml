services:
  mysql:
    image: mysql:8.4.11
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --default-storage-engine=InnoDB
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mangabridge}
      MYSQL_USER: ${MYSQL_USER:-mangabridge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mangabridge_local_only}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/docker/mysql/01-schema-options.sql:/docker-entrypoint-initdb.d/01-schema-options.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --connect-timeout=2 --batch --skip-column-names --execute="SELECT 1" >/dev/null 2>&1'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
volumes:
  mysql_data:

services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mangabridge}
      POSTGRES_USER: ${POSTGRES_USER:-mangabridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mangabridge_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres_data:
